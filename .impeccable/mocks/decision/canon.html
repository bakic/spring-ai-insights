<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Category standard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;width:1440px;height:900px;overflow:hidden;font-family:Inter,sans-serif;background:#f3f4f6;color:#111827;display:grid;grid-template-columns:220px 1fr}
.side{background:#111827;color:#cbd5e1;padding:22px 14px;font-size:14px}.side b{color:#fff;display:block;margin:0 8px 24px;font-size:17px}.side div{padding:8px 10px;border-radius:6px}.side .on{background:#1f2937;color:#fff}
main{padding:24px 32px}h1{font-size:22px;margin:0 0 18px}
.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}.card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}.card small{color:#6b7280;font-size:12px}.card b{display:block;font-size:28px;margin-top:6px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}.chart{background:#fff;border-radius:10px;height:250px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
svg{width:100%;height:190px}
.tbl{background:#fff;border-radius:10px;margin-top:14px;padding:12px 16px;box-shadow:0 1px 3px rgba(0,0,0,.08);font-size:14px}.tbl div{padding:8px 0;border-bottom:1px solid #e5e7eb}
</style></head><body>
<nav class="side"><b>AI Insights</b><div class="on">Overview</div><div>Usage</div><div>Cost</div><div>Knowledge base</div><div>Tools</div><div>Quality</div></nav>
<main><h1>Overview</h1>
<div class="cards"><div class="card"><small>Turns</small><b>199</b></div><div class="card"><small>Conversations</small><b>66</b></div><div class="card"><small>Users</small><b>12</b></div><div class="card"><small>Cost</small><b>$0.085</b></div><div class="card"><small>Tokens</small><b>50.2k</b></div><div class="card"><small>Errors</small><b>0%</b></div></div>
<div class="charts"><div class="chart"><small>Turns per day</small><svg viewBox="0 0 400 190"><polyline fill="none" stroke="#2563eb" stroke-width="3" points="0,150 60,120 120,110 180,130 240,90 300,160 360,40"/></svg></div>
<div class="chart"><small>Cost per day</small><svg viewBox="0 0 400 190"><polyline fill="none" stroke="#2563eb" stroke-width="3" points="0,160 60,130 120,120 180,135 240,95 300,165 360,50"/></svg></div></div>
<div class="tbl"><div>16:34 · demo-0055 · 975 ms · $0.000885</div><div>16:34 · demo-0058 · 744 ms · $0.001153</div><div>16:33 · demo-0066 · 1.0 s · $0.001153</div></div>
</main></body></html>
