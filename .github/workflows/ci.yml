name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 7.0 is the oldest supported server (MongoTestSupport.IMAGE).
        mongo: ['mongo:7.0', 'mongo:8.0']
    name: build (${{ matrix.mongo }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - run: ./gradlew build verifyPublication -PmongoImage=${{ matrix.mongo }}
      - if: failure()
        run: docker ps -a && for c in $(docker ps -aq); do docker logs --tail 60 $c; done
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports-${{ strategy.job-index }}
          path: '**/build/reports/tests/'
