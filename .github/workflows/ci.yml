name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 5.0 is the oldest supported server (MongoTestSupport.IMAGE).
        mongo: ['mongo:5.0', 'mongo:7.0']
    name: build (${{ matrix.mongo }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build verifyPublication -PmongoImage=${{ matrix.mongo }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ strategy.job-index }}
          path: '**/build/reports/tests/'
